<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - TasteTiers</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .auth-background {
            background: url('background2.png') no-repeat center center fixed;
            background-size: cover;
        }
    </style>
</head>
<body class="auth-background">
    <header>
        <div class="auth-buttons">
            <button class="auth-btn" onclick="location.href='index.html'">⬅</button>
        </div>
    </header>
    <main class="auth-container">
        <h1 class="title2">Sign Up</h1>
        <form class="auth-form">
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="form-btn">Sign Up</button>
        </form>
        <a href="login.html" class="auth-link">Already have an account? Log in</a>
    </main>
</body>
</html>
