version: '3.8'

services:
  springboot-app:
    build:
      context: .
    container_name: tastetier-backend
    restart: always
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_PROFILES_ACTIVE: dev
      ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./build/libs:/app/libs
    command: ["java", "-jar", "/app/libs/base-0.0.1-SNAPSHOT.jar"]

volumes:
  mysql-data:



