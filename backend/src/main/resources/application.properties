# Application name
spring.application.name=base

# Database Configuration
# For local development (Docker)
spring.datasource.url=${JAWSDB_URL:jdbc:mysql://mysql-container:3306/mydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${JAWSDB_USERNAME:user}
spring.datasource.password=${JAWSDB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5

# JPA & Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port (Heroku will override this with PORT environment variable)
server.port=${PORT:8082}

# Enable CORS
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
spring.web.cors.allowed-headers=*

# Profile configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
