<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TasteTiers</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Playfair+Display:wght@700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .auth-background {
            background: url('background2.png') no-repeat center center fixed;
            background-size: cover;
        }
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            color: #757575;
            border: 1px solid #dadce0;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            margin-top: 16px;
            transition: background-color 0.3s;
            text-decoration: none;
        }
        .google-btn:hover {
            background-color: #f8f9fa;
        }
        .google-btn img {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            color: #757575;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dadce0;
        }
        .divider span {
            padding: 0 10px;
        }
    </style>
</head>
<body class="auth-background">
    <header>
        <div class="auth-buttons">
            <button class="auth-btn" onclick="location.href='index.html'">⬅</button>
        </div>
    </header>
    <main class="auth-container">
        <h1 class="title2">Login</h1>
        <form class="auth-form">
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit" class="form-btn">Log In</button>
        </form>
        <div class="divider"><span>or</span></div>
        <a href="http://localhost:8082/oauth2/authorization/google" class="google-btn">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Continue with Google
        </a>
        <a href="signup.html" class="auth-link">Don't have an account? Sign up</a>
    </main>
</body>
</html>
